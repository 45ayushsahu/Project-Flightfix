{% load static %}

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>FlightFix | Login</title>

    <link rel="stylesheet" href="{% static 'core/css/style.css' %}">
</head>

<body class="login-page">

    <div class="login-container">

        <!-- Logo -->

        <div class="login-logo">
            ✈️ <span>FlightFix</span>
        </div>


        <div class="login-card">

            <div class="login-header">

                <h1>Welcome back</h1>

                <p>
                    Sign in to manage your aircraft maintenance operations.
                </p>

            </div>


            <!-- Login Form -->

            <form method="POST">

                {% csrf_token %}


                {% if messages %}
                    {% for message in messages %}
                        <div class="login-message">
                            {{ message }}
                        </div>
                    {% endfor %}
                {% endif %}


                <div class="form-group">

                    <label for="username">
                        Username
                    </label>

                    <input
                        type="text"
                        id="username"
                        name="username"
                        placeholder="Enter your username"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="password">
                        Password
                    </label>

                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Enter your password"
                        required
                    >

                </div>


                <div class="login-options">

                    <label>
                        <input type="checkbox">
                        Remember me
                    </label>

                    <a href="#">
                        Forgot password?
                    </a>

                </div>


                <button
                    type="submit"
                    class="login-submit"
                >
                    Login to FlightFix →
                </button>

            </form>


            <div class="login-footer">

                <p>
                    FlightFix Aircraft Maintenance Management System
                </p>

            </div>

        </div>

    </div>

</body>
</html>
